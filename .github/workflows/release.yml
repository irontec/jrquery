name: Release jrquery

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check syntax
        run: python -m py_compile jrquery.py

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jrquery.py
